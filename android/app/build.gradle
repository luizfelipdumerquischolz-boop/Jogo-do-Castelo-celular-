plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coroadepedra.jogo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.coroadepedra.jogo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // A chave fica fora do repositório (android/chave.properties não é enviado ao GitHub).
            def props = new Properties()
            def f = rootProject.file('chave.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
